<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Top Utility Bar -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-2 flex justify-between items-center text-xs text-gray-600">
            <div class="flex items-center gap-4">
                <select class="bg-transparent border-none focus:outline-none">
                    <option>English</option>
                </select>
                <select class="bg-transparent border-none focus:outline-none">
                    <option>Dollar</option>
                </select>
            </div>
            <div class="flex items-center gap-6">
                <a href="#" class="hover:text-gray-900">Tracking Package</a>
                <a href="#" class="hover:text-gray-900">FAQ</a>
                <a href="#" class="hover:text-gray-900">About Us</a>
                <a href="#" class="hover:text-gray-900">Contact Us</a>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <div class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Logo and Menu -->
            <div class="flex items-center gap-8">
                <h1 class="text-lg font-bold tracking-wider">ECOMMERCE</h1>
                <div class="flex items-center gap-1 text-sm">
                    <span class="text-gray-500">Where Wire?</span>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-8 text-sm font-medium">
                <div class="relative group">
                    <button class="flex items-center gap-1 hover:text-gray-900">
                        All Category
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                </div>
                <a href="#" class="hover:text-gray-900">Gift Cards</a>
                <a href="#" class="hover:text-gray-900">Special Event</a>
            </nav>

            <!-- Icons -->
            <div class="flex items-center gap-4">
                <button class="hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                </button>
                <button class="hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </button>
                <button class="hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Main Hero Card - Takes 2 columns -->
            <div class="col-span-2 relative flex flex-col justify-between  bg-[#A4B494] sm:bg-transparent rounded-3xl ">
                 <div class="absolute inset-0 -z-20 hidden sm:flex">
                    <img src="./image/image 3.png" alt="Woman in summer outfit" class="w-full rounded-3xl h-auto object-cover ">
                </div>
                <div class="p-12 pb-0">
                    <h2 class="text-white text-5xl font-light leading-tight mb-6">
                        Color of<br>
                        Summer<br>
                        Outfit
                    </h2>
                    <p class="text-white text-sm mb-8 opacity-90">
                        100+ Collections for your outfit<br>
                        ingredients in the summer
                    </p>
                    <button
                        class="bg-black text-white px-10 py-3 rounded-full text-sm font-medium tracking-wide mb-8 hover:bg-gray-900 transition-colors">
                        VIEW COLLECTIONS
                    </button>
                </div>
                <!-- Hero Image  -->
                <div class="relative  ">
                    <img src="./image/image 3.png" alt="Woman in summer outfit" class="w-full rounded-b-3xl h-auto sm:hidden object-cover">
                </div>
            </div>

            <!-- Side Cards - Takes 1 column -->
            <div class="flex flex-col gap-6">
                <!-- Outdoor Active Card -->
                <div class="relative rounded-3xl overflow-hidden h-64 group cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1571333250630-f0230c320b6d?w=600&h=600&fit=crop"
                        alt="Outdoor Active"
                        class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/50"></div>
                    <div class="absolute top-6 left-6">
                        <p class="text-black text-2xl font-semibold leading-tight">
                            Outdoor<br>
                            Active
                        </p>
                    </div>
                </div>

                <!-- Casual Comfort Card -->
                <div class="relative rounded-3xl overflow-hidden h-64 group cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&h=600&fit=crop"
                        alt="Casual Comfort"
                        class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/50"></div>
                    <div class="absolute top-6 left-6">
                        <p class="text-black text-2xl font-semibold leading-tight">
                            Casual<br>
                            Comfort
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
